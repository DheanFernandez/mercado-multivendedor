# Integración continua mínima (RC10; EQ-07 pide ejecutar las verificaciones en cada pull request).
# La base de pruebas es un servicio PostgreSQL del propio flujo, con la MISMA dirección que usa el entorno local
# (127.0.0.1:55433/mercado_test), de modo que la guarda de seguridad de las pruebas se cumple igual. No se usa Supabase.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mercado_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mercado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      MERCADO_TEST_DB_EXTERNA: "1"
      # Sin .env en CI: la aplicación de prueba lee estas variables (valores locales de prueba, no son secretos).
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:55433/mercado_test
      DIRECT_URL: postgresql://postgres:test@127.0.0.1:55433/mercado_test
      SUPABASE_URL: http://localhost:54321
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run lint
      - run: npm run arquitectura
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
